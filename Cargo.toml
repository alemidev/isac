[package]
name = "isac"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dircpy = "0.3"
indexmap = { version = "2.13", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-inline-default = "1.0"
serde_default = "0.2"
thiserror = "2.0"
toml = { version = "1.0", features = ["preserve_order"] }
